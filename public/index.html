<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIGR — Sistema Integral de Gestión de Restaurante</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
    <h1>SIGR</h1>
    <div id="user-info" class="hidden">
        <span id="user-name"></span>
        <button id="logout">Salir</button>
    </div>
</header>

<main>
    <section id="login-view" class="card">
        <h2>Iniciar sesión</h2>
        <form id="login-form">
        <label>Email <input type="email" id="email" required value="admin@sigr.local" /></label>
        <label>Contraseña <input type="password" id="password" required value="admin123" /></label>
        <button type="submit">Entrar</button>
        </form>
        <p id="login-error" class="error"></p>
    </section>

    <section id="app-view" class="hidden">
        <nav id="tabs">
        <button data-tab="menu">Menú</button>
        <button data-tab="orders">Pedidos</button>
        <button data-tab="reservations">Reservas</button>
        <button data-tab="cash">Caja y reportes</button>
        </nav>

        <section id="tab-menu" class="tab card">
        <h2>Menú</h2>
        <div class="row">
            <input id="cat-name" placeholder="Nueva categoría" />
            <button id="add-cat">Agregar categoría</button>
        </div>
        <ul id="cat-list"></ul>
        <h3>Platos</h3>
        <div class="row">
            <input id="dish-name" placeholder="Nombre" />
            <input id="dish-price" type="number" step="0.01" placeholder="Precio" />
            <select id="dish-cat"></select>
            <button id="add-dish">Agregar plato</button>
        </div>
        <ul id="dish-list"></ul>
        </section>

        <section id="tab-orders" class="tab card hidden">
        <h2>Pedidos</h2>
        <div class="row">
            <input id="order-table" type="number" placeholder="Mesa" style="width:90px" />
            <select id="order-dish"></select>
            <input id="order-qty" type="number" value="1" min="1" style="width:70px" />
            <button id="add-item">Agregar ítem</button>
            <button id="create-order">Crear pedido</button>
        </div>
        <ul id="order-items-preview"></ul>
        <h3>Listado</h3>
        <ul id="order-list"></ul>
        </section>

        <section id="tab-reservations" class="tab card hidden">
        <h2>Reservas</h2>
        <div class="row">
            <input id="res-name" placeholder="Cliente" />
            <input id="res-phone" placeholder="Teléfono" />
            <input id="res-date" type="date" />
            <input id="res-time" type="time" />
            <input id="res-people" type="number" min="1" value="2" style="width:70px" />
            <button id="create-res">Crear reserva</button>
        </div>
        <ul id="res-list"></ul>
        </section>

        <section id="tab-cash" class="tab card hidden">
        <h2>Caja y reportes</h2>
        <div class="row">
            <input id="opening-amount" type="number" step="0.01" value="0" style="width:120px" />
            <button id="open-cash">Abrir caja</button>
            <input id="closing-amount" type="number" step="0.01" placeholder="Monto cierre" style="width:140px" />
            <button id="close-cash">Cerrar caja</button>
        </div>
        <div id="cash-status"></div>
        <h3>Reporte del día</h3>
        <button id="load-report">Actualizar reporte</button>
        <pre id="report"></pre>
        </section>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
